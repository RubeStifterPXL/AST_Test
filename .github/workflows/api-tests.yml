name: API tests (Postman / Newman)

on:
  # push enkel op main; feature-branches lopen via de pull request (geen dubbele runs)
  push:
    branches: [main]
    paths:
      - "api-tests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "api-tests/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Tegen welke server testen? (standaard: team 2)"
        required: true
        default: "https://qacademyb.duckdns.org"
        type: choice
        options:
          - "https://qacademyb.duckdns.org"
          - "https://qacademya.duckdns.org"

# Nooit tegelijk met de web-tests: C1 (reset-test-data) wist alle inschrijvingen van het team.
concurrency:
  group: qacademy-environment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newman:
    name: Run QAcademy API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-tests
    env:
      BASE_URL: ${{ inputs.base_url || vars.QA_BASE_URL || 'https://qacademyb.duckdns.org' }}
      KEYCLOAK_URL: ${{ vars.QA_KEYCLOAK_URL || 'https://qacademy-auth.duckdns.org' }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secret
        run: |
          if [ -z "$QA_PASSWORD" ]; then
            echo "::error::Repository secret QA_PASSWORD is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-tests/package-lock.json

      - name: Install Newman and reporters
        run: npm ci

      # Een rode stap omdat een test een bug vindt is normaal en gewenst.
      - name: Run Postman collection
        run: >
          npx newman run postman/qacademy-team2.postman_collection.json
          --environment postman/qacademy-team2.postman_environment.json
          --env-var "base_url=$BASE_URL"
          --env-var "keycloak_url=$KEYCLOAK_URL"
          --env-var "password=$QA_PASSWORD"
          --reporters cli,htmlextra,junit,json
          --reporter-htmlextra-export reports/report.html
          --reporter-htmlextra-title "QAcademy team 2 - API tests"
          --reporter-junit-export reports/junit.xml
          --reporter-json-export reports/newman.json
          --timeout-request 30000
          --color on

      - name: Write job summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("reports/newman.json")) { console.log("No Newman report found"); process.exit(0); }
            const run = require("./reports/newman.json").run;
            const a = run.stats.assertions, r = run.stats.requests;
            let md = "## QAcademy API tests\n\nServer: " + process.env.BASE_URL + "\n\n| Requests | Assertions | Failed assertions |\n|---|---|---|\n";
            md += `| ${r.total} | ${a.total} | ${a.failed} |\n\n`;
            if (run.failures.length) {
              md += "### Failed assertions\n\n| Request | Assertion |\n|---|---|\n";
              run.failures.forEach(f => md += `| ${f.source.name} | ${(f.error.test || f.error.message).replace(/\|/g, "\\|")} |\n`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-${{ github.run_number }}
          path: api-tests/reports/
          if-no-files-found: warn
          retention-days: 30
